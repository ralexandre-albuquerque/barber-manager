name: Build and Push to ECR

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: barber-manager
  ROLE_ARN: arn:aws:iam::041863017448:role/barber-manager-github-actions-role

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build application with Maven
        run: mvn clean package -DskipTests

      - name: Show OIDC token claims
        run: |
          RESP=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          JWT=$(echo "$RESP" | jq -r '.value')
          PAYLOAD=$(echo "$JWT" | cut -d. -f2)
          PAD=$((4 - ${#PAYLOAD} % 4))
          if [ "$PAD" -ne 4 ]; then
            PAYLOAD="${PAYLOAD}$(printf '%*s' "$PAD" | tr ' ' '=')"
          fi
          echo "$PAYLOAD" | base64 -d 2>/dev/null | jq '{iss, aud, sub, repository, repository_owner, ref}'

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          retry-max-attempts: 1
          role-skip-session-tagging: true

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
