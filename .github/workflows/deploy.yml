name: Develop - Build, Push and Deploy

on:
  push:
    branches: [ develop ]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: barber-manager
  ROLE_ARN: arn:aws:iam::041863017448:role/barber-manager-github-actions-role
  EC2_INSTANCE_ID: i-04234da24cd785b7a

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build application with Maven
        run: mvn clean package -DskipTests

      - name: Show OIDC token claims
        run: |
          RESP=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          JWT=$(echo "$RESP" | jq -r '.value')
          PAYLOAD=$(echo "$JWT" | cut -d. -f2)
          PAD=$((4 - ${#PAYLOAD} % 4))
          if [ "$PAD" -ne 4 ]; then
            PAYLOAD="${PAYLOAD}$(printf '%*s' "$PAD" | tr ' ' '=')"
          fi
          echo "$PAYLOAD" | base64 -d 2>/dev/null | jq '{iss, aud, sub, repository, repository_owner, ref}'

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          retry-max-attempts: 1
          role-skip-session-tagging: true

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to EC2 via SSM
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          SCRIPT=$(cat <<EOF
          set -euo pipefail
          IMAGE=${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
          aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}
          docker pull \$IMAGE
          umask 077
          {
            echo SPRING_PROFILES_ACTIVE=dev
            echo SPRING_DATASOURCE_URL=jdbc:postgresql://barber-manager-db.cu7uo8cyy4el.us-east-1.rds.amazonaws.com:5432/postgres
            echo SPRING_DATASOURCE_USERNAME=postgres
            printf 'SPRING_DATASOURCE_PASSWORD=%s\n' "\$(aws ssm get-parameter --name /barber-manager/rds/password --with-decryption --query Parameter.Value --output text --region ${AWS_REGION})"
          } > /home/ec2-user/barber-manager.env
          chmod 600 /home/ec2-user/barber-manager.env
          docker stop barber-manager || true
          docker rm barber-manager || true
          docker run -d --name barber-manager --restart unless-stopped -p 8080:8080 --env-file /home/ec2-user/barber-manager.env \$IMAGE
          docker ps --filter name=barber-manager
          EOF
          )
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 600 \
            --cli-input-json "$(jq -n --arg s "$SCRIPT" --arg id "$EC2_INSTANCE_ID" '{
              InstanceIds: [$id],
              DocumentName: "AWS-RunShellScript",
              TimeoutSeconds: 600,
              Parameters: { commands: [$s] }
            }')" \
            --query "Command.CommandId" \
            --output text)
          echo "SSM Command ID: $COMMAND_ID"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${EC2_INSTANCE_ID}"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${EC2_INSTANCE_ID}"